name: Dev Deployment
on:
  workflow_dispatch:
jobs:
  upload-and-attest-artifact:
    name: Upload and Attest Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: the-devops-project-artifact
          path: ./build
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "build/**"

  deploy-to-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: upload-and-attest-artifact
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: the-devops-project-artifact
      - name: Deploying to Dev Environment
        run: echo "Deploying to Dev Environment!"
      - name: Deployment Complete to Dev Environment
        run: echo "Deployment to Dev Environment Complete!"
      
